{% extends "base.html" %}

{% block title %}
404 Page Not Found | COVID Analytics Dashboard
{% endblock %}

{% block content %}

<div class="container d-flex flex-column justify-content-center align-items-center py-5" style="min-height: 60vh;">

    <div class="text-center p-5 rounded-4 shadow-sm bg-white" style="max-width: 500px;">

        <i class="fa-solid fa-route fa-5x text-primary mb-4 opacity-75"></i>

        <h1 class="display-1 fw-bold text-dark mb-0">

            404

        </h1>

        <h3 class="text-muted fw-light mb-4">

            Oops! Page Not Found

        </h3>

        <p class="text-secondary mb-4">
            We couldn't find the page you were looking for. It might have been moved or doesn't exist anymore.
        </p>

        <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg px-4 rounded-pill shadow-sm">

            <i class="fa-solid fa-house me-2"></i>
            Return to Homepage

        </a>

    </div>

</div>

{% endblock %}
